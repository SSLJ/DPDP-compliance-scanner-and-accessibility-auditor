services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dpdp_scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dpdp_scanner
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./dpdp-app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./dpdp-app:/app
      - /app/node_modules

volumes:
  postgres_data:
